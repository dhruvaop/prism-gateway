services:
  alpha:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "/app/mock_provider.py", "--port", "9001", "--name", "alpha"]
    volumes:
      - ./scripts/mock_provider.py:/app/mock_provider.py:ro
    ports: ["9001:9001"]
    restart: unless-stopped

  beta:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "/app/mock_provider.py", "--port", "9002", "--name", "beta"]
    volumes:
      - ./scripts/mock_provider.py:/app/mock_provider.py:ro
    ports: ["9002:9002"]
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      PRISM_DATA_DIR: /app/data
      PRISM_DB: /app/runtime/prism.db
    volumes:
      - ./data:/app/data:ro
      - ./deploy/gateway_config.sample.json:/app/data/gateway_config.sample.json:ro
      - prism-data:/app/runtime
    depends_on:
      - alpha
      - beta
    expose: ["8080"]
    restart: unless-stopped

  console:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "8081:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  prism-data:
