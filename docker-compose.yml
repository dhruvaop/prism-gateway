services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-prism-demo-only}
    volumes:
      - prism-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  alpha:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "/app/mock_provider.py", "--port", "9001", "--name", "alpha"]
    volumes:
      - ./scripts/mock_provider.py:/app/mock_provider.py:ro
    ports: ["9001:9001"]
    restart: unless-stopped

  beta:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "/app/mock_provider.py", "--port", "9002", "--name", "beta"]
    volumes:
      - ./scripts/mock_provider.py:/app/mock_provider.py:ro
    ports: ["9002:9002"]
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: enterprise
      DATABASE_URL: jdbc:postgresql://db:5432/prism
      DATABASE_USERNAME: prism
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-prism-demo-only}
      PRISM_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - ./deploy/gateway_config.sample.json:/app/data/gateway_config.sample.json:ro
    depends_on:
      db:
        condition: service_healthy
      alpha:
        condition: service_started
      beta:
        condition: service_started
    expose: ["8080"]
    restart: unless-stopped

  console:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "8081:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  prism-postgres:
