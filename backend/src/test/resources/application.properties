spring.datasource.url=jdbc:sqlite:./target/prism-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.flyway.enabled=false
prism.auth.jwt-secret=test-only-secret-that-is-more-than-32-bytes-long
prism.auth.jwt-ttl-seconds=3600
prism.data-dir=../data
prism.upstream-timeout-ms=12000
prism.retry.max-attempts=3
prism.retry.initial-backoff-ms=200
prism.retry.backoff-multiplier=2
