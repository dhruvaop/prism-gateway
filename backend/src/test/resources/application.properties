# Never let a developer's real provider key leak into the offline test suite.
openrouter.api-key=
gemini.api-key=
openrouter.prefer-as-primary=false
spring.datasource.url=jdbc:sqlite:./target/prism-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.flyway.enabled=false
prism.auth.jwt-secret=test-only-secret-that-is-more-than-32-bytes-long
prism.auth.jwt-ttl-seconds=3600
prism.data-dir=../data
prism.upstream-timeout-ms=12000
prism.retry.max-attempts=3
prism.retry.initial-backoff-ms=200
prism.retry.backoff-multiplier=2
# Tests run without SMTP, so the reset service must return its development link.
prism.mail.expose-reset-link=true
# Keep the demo paywall out of the way unless a test overrides the limit.
prism.billing.trial-requests=1000
prism.billing.razorpay-key-id=
prism.billing.razorpay-key-secret=
prism.billing.razorpay-webhook-secret=
prism.billing.trial-webhook-url=
