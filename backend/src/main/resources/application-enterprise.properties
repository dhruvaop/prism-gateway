spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/prism}
spring.datasource.username=${DATABASE_USERNAME:prism}
spring.datasource.password=${DATABASE_PASSWORD:prism}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN:3}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
# Render can reset a fresh outbound connection while it moves traffic between
# routes. Retry the migration connection instead of crashing the boot.
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:10}
spring.flyway.connect-retries-interval=${FLYWAY_CONNECT_RETRIES_INTERVAL:5s}
prism.mail.expose-reset-link=${PRISM_MAIL_EXPOSE_RESET_LINK:false}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.prefer-as-primary=${OPENROUTER_PREFER_AS_PRIMARY:false}
prism.auth.jwt-secret=${JWT_SECRET:}
prism.auth.jwt-ttl-seconds=${JWT_TTL_SECONDS:86400}
