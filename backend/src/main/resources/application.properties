server.port=${PORT:8080}
spring.application.name=prism-gateway
spring.datasource.url=jdbc:sqlite:${PRISM_DB:../prism-java.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# Production sets this to true so a missing enterprise profile fails loudly
# instead of silently creating a disposable container-local database.
prism.require-postgres=${PRISM_REQUIRE_POSTGRES:false}
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.jackson.default-property-inclusion=non_null
# Reasoning models can emit their first visible token after the default 30s async window.
spring.mvc.async.request-timeout=${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:120000}
prism.data-dir=${PRISM_DATA_DIR:../data}
prism.upstream-timeout-ms=${PRISM_UPSTREAM_TIMEOUT_MS:12000}
prism.routing-strategy=${PRISM_ROUTING_STRATEGY:failover}
# Comma-separated browser origins allowed to call the gateway. Add the deployed
# console/chat origin (for example https://prism-console.pages.dev) when the
# frontend is hosted separately from the API.
prism.cors.allowed-origins=${PRISM_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
# Two-layer semantic cache. L1 is bounded process memory; L2 is the opt-in
# per-key Postgres cache. Both are purged daily at 17:00 Asia/Kolkata and the
# database is capped on every write so a limited Postgres plan cannot grow
# without bound.
prism.cache.short-term.max-entries=${PRISM_CACHE_MEMORY_MAX_ENTRIES:500}
prism.cache.short-term.ttl-seconds=${PRISM_CACHE_MEMORY_TTL_SECONDS:900}
prism.cache.max-entries=${PRISM_CACHE_MAX_ENTRIES:1000}
prism.cache.max-entries-per-key=${PRISM_CACHE_MAX_ENTRIES_PER_KEY:200}
prism.cache.max-entry-bytes=${PRISM_CACHE_MAX_ENTRY_BYTES:32768}
prism.cache.max-hit-rows=${PRISM_CACHE_MAX_HIT_ROWS:5000}
prism.cache.retention-hours=${PRISM_CACHE_RETENTION_HOURS:24}
prism.cache.purge-enabled=${PRISM_CACHE_PURGE_ENABLED:true}
prism.cache.purge-cron=${PRISM_CACHE_PURGE_CRON:0 0 17 * * *}
prism.cache.purge-zone=${PRISM_CACHE_PURGE_ZONE:Asia/Kolkata}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.prefer-as-primary=${OPENROUTER_PREFER_AS_PRIMARY:false}
openrouter.model=${OPENROUTER_MODEL:nvidia/nemotron-3.5-lightning:free}
openrouter.max-tokens=${OPENROUTER_MAX_TOKENS:4096}
# Task-based auto routing: the classification router maps a prompt to a task and
# the matching model below answers it. Empty values fall back to openrouter.model.
# Simple prompts always use the ordinary free model, never the :online search route.
openrouter.model-simple=${OPENROUTER_MODEL_SIMPLE:}
openrouter.model-search=${OPENROUTER_MODEL_SEARCH:}
openrouter.model-research=${OPENROUTER_MODEL_RESEARCH:nvidia/nemotron-3-ultra-550b-a55b:free}
openrouter.model-reasoning=${OPENROUTER_MODEL_REASONING:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free}
openrouter.model-code=${OPENROUTER_MODEL_CODE:cohere/north-mini-code:free}
# Append :online to the search/simple model so web-search tasks get live results.
openrouter.search-online=${OPENROUTER_SEARCH_ONLINE:false}
# Google Gemini (OpenAI-compatible endpoint). When prefer-as-primary is true the
# gateway routes fast/smart traffic to Gemini and falls back to OpenRouter, then mocks.
# Gemini's OpenAI-compatible endpoint is a fallback before the canned mocks.
# The configured free tier is metered at zero unless prices are added to the price table.
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.prefer-as-primary=${GEMINI_PREFER_AS_PRIMARY:false}
# Optional OpenAI provider. Configure a key to make the per-key routing profile
# "openai" available; no other code change is needed.
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
prism.auth.jwt-secret=${JWT_SECRET:local-prism-jwt-secret-change-this-before-deployment-2026}
prism.auth.jwt-ttl-seconds=${JWT_TTL_SECONDS:86400}

# --- Transactional email (password reset) ---
# Configure these to deliver real reset emails. Without a host the gateway uses
# the development fallback below instead of pretending the mail was sent.
prism.mail.host=${PRISM_MAIL_HOST:}
prism.mail.port=${PRISM_MAIL_PORT:587}
prism.mail.username=${PRISM_MAIL_USERNAME:}
prism.mail.password=${PRISM_MAIL_PASSWORD:}
prism.mail.from=${PRISM_MAIL_FROM:}
prism.mail.from-name=${PRISM_MAIL_FROM_NAME:Prism Gateway}
prism.mail.starttls=${PRISM_MAIL_STARTTLS:true}
prism.mail.ssl=${PRISM_MAIL_SSL:false}
# Dev helper: when SMTP is not configured, return the reset link in the API response.
# Disable this in production; the enterprise profile does.
prism.mail.expose-reset-link=${PRISM_MAIL_EXPOSE_RESET_LINK:true}
prism.app.chat-url=${PRISM_CHAT_URL:http://localhost:5173}
prism.app.console-url=${PRISM_CONSOLE_URL:http://localhost:5173}
prism.password-reset.ttl-minutes=${PRISM_PASSWORD_RESET_TTL_MINUTES:30}
prism.password-reset.cooldown-seconds=${PRISM_PASSWORD_RESET_COOLDOWN_SECONDS:60}

# --- Free demo and Razorpay subscriptions ---
# Every new chat account gets this many successful requests before the paywall.
prism.billing.trial-requests=${PRISM_TRIAL_REQUESTS:5}
prism.billing.subscription-days=${PRISM_SUBSCRIPTION_DAYS:30}
prism.billing.pro-amount-paise=${RAZORPAY_PRO_AMOUNT_PAISE:49900}
prism.billing.enterprise-amount-paise=${RAZORPAY_ENTERPRISE_AMOUNT_PAISE:199900}
prism.billing.currency=${RAZORPAY_CURRENCY:INR}
# The key id is public (Checkout needs it). The secret stays server-side and is
# never returned by an API or written to logs.
prism.billing.razorpay-key-id=${RAZORPAY_PAY_KEY_ID:}
prism.billing.razorpay-key-secret=${RAZORPAY_PAY_KEY_SECRET:}
prism.billing.razorpay-merchant-id=${RAZORPAY_MERCHANT_ID:}
# Set the same value in the Razorpay Dashboard webhook settings.
prism.billing.razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
prism.billing.checkout-name=${PRISM_BILLING_NAME:Prism Gateway}
# Optional outbound endpoint notified once when a user's last demo request succeeds.
prism.billing.trial-webhook-url=${PRISM_TRIAL_WEBHOOK_URL:}
prism.billing.trial-webhook-secret=${PRISM_TRIAL_WEBHOOK_SECRET:}
