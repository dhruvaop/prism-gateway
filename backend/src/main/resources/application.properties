server.port=${PORT:8080}
spring.application.name=prism-gateway
spring.datasource.url=jdbc:sqlite:${PRISM_DB:../prism-java.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=never
spring.jackson.default-property-inclusion=non_null
prism.data-dir=${PRISM_DATA_DIR:../data}
prism.upstream-timeout-ms=${PRISM_UPSTREAM_TIMEOUT_MS:12000}
