server.port=${PORT:8080}
spring.application.name=prism-gateway
spring.datasource.url=jdbc:sqlite:${PRISM_DB:../prism-java.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.jackson.default-property-inclusion=non_null
prism.data-dir=${PRISM_DATA_DIR:../data}
prism.upstream-timeout-ms=${PRISM_UPSTREAM_TIMEOUT_MS:12000}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.prefer-as-primary=${OPENROUTER_PREFER_AS_PRIMARY:false}
